<div class="login-page">
  <!-- Branding / Logo -->
  <section class="login-page__branding" aria-label="Branding">
    <div class="login-page__branding-bg" role="presentation"></div>
    <img
      class="login-page__logo"
      src="assets/shared/logo-web.png"
      alt="Alarmas que piensan por ti"
      width="716"
      height="716"
    />
  </section>

  <!-- Formulario de Login -->
  <section class="login-page__form-section" aria-label="Formulario de inicio de sesión">
    <div class="login-page__form-bg" role="presentation"></div>

    <form class="login-form" (ngSubmit)="onSubmit()" #loginForm="ngForm" novalidate>
      <h1 class="login-form__title">Iniciar sesión</h1>

      <!-- Campo Usuario -->
      <div class="login-form__field">
        <label class="login-form__label" for="usuario">Usuario</label>
        <input
          id="usuario"
          type="text"
          class="login-form__input"
          placeholder="Ingresa tu usuario"
          [(ngModel)]="usuario"
          name="usuario"
          required
          autocomplete="username"
        />
      </div>

      <!-- Campo Contraseña -->
      <div class="login-form__field">
        <label class="login-form__label" for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          class="login-form__input"
          placeholder="Ingresa tu contraseña"
          [(ngModel)]="password"
          name="password"
          required
          autocomplete="current-password"
        />
      </div>

      <!-- Botón de Envío -->
      <button type="submit" class="login-form__button" [disabled]="loginForm.invalid">
        Iniciar sesión
      </button>
    </form>
  </section>
</div>
